services:
  - type: web
    name: piliapp-snapshot
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /tmp/piliapp-data
