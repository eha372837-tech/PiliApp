services:
  - type: web
    name: piliapp-snapshot
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: piliapp-data
      mountPath: /var/data
      sizeGB: 1
